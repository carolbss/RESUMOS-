{id:'vg', t:'🩺 Visão Geral', html:`
<h2>🩺 Visão Geral & Quadro Clínico</h2>
<p><strong>Retocolite ulcerativa (RCU)</strong> é uma doença inflamatória intestinal (DII) crônica, de inflamação <strong>contínua e ascendente</strong>, restrita à <strong>mucosa e submucosa</strong>, que começa <strong>sempre no reto</strong> e se estende proximalmente sem áreas de pele saudável (sem <em>"skip lesions"</em>). <span class="kid">(É uma ferida que começa lá embaixo, no fim do intestino grosso, e vai subindo numa fita contínua, sem pular pedaços.)</span></p>

<div class="box o"><div class="box-t">Quadro clínico clássico</div>
<ul>
<li><strong>Diarreia com sangue e muco</strong> (hematoquezia) — sintoma cardinal</li>
<li><strong>Urgência e tenesmo</strong> (vontade de evacuar com reto vazio)</li>
<li>Dor abdominal em cólica, alívio pós-evacuação</li>
<li>Sintomas <strong>noturnos</strong> e perda de peso nas formas extensas</li>
</ul></div>

<h3>// Montreal — extensão</h3>
<table>
<tr><th>Classe</th><th>Extensão</th><th>Observação</th></tr>
<tr><td><strong>E1</strong></td><td>Proctite (até reto)</td><td>~30–60% ao dx</td></tr>
<tr><td><strong>E2</strong></td><td>Colite esquerda (até flexura esplênica)</td><td>—</td></tr>
<tr><td><strong>E3</strong></td><td>Colite extensa / pancolite (além da flexura esplênica)</td><td>maior risco de CA</td></tr>
</table>

<h3>// RCU × Doença de Crohn (alta incidência em prova)</h3>
<table>
<tr><th>—</th><th>RCU</th><th>Crohn</th></tr>
<tr><td>Distribuição</td><td><strong>Contínua</strong>, ascende do reto</td><td>Salteada (skip lesions)</td></tr>
<tr><td>Profundidade</td><td>Mucosa/submucosa</td><td>Transmural</td></tr>
<tr><td>Local</td><td>Cólon/reto só</td><td>Boca ao ânus (íleo terminal)</td></tr>
<tr><td>Granuloma</td><td>Ausente</td><td>Não-caseoso (presente)</td></tr>
<tr><td>Fístula/estenose</td><td>Raras</td><td>Comuns</td></tr>
<tr><td>Tabaco</td><td><strong>Protetor</strong> (paradoxo)</td><td>Fator de risco</td></tr>
<tr><td>p-ANCA / ASCA</td><td>p-ANCA +</td><td>ASCA +</td></tr>
<tr><td>Cirurgia cura?</td><td><strong>Sim</strong> (proctocolectomia)</td><td>Não cura</td></tr>
</table>

<div class="box p"><div class="box-t">Manifestações extra-intestinais</div>
<p><strong>Relacionadas à atividade:</strong> artrite periférica, eritema nodoso, episclerite, estomatite aftosa.<br>
<strong>Independentes da atividade:</strong> <strong>colangite esclerosante primária (CEP)</strong> — clássica da RCU e fator de risco maior para colangiocarcinoma e CCR —, espondilite anquilosante, uveíte, pioderma gangrenoso.</p></div>
`},

{id:'dx', t:'🔬 Diagnóstico', html:`
<h2>🔬 Diagnóstico</h2>
<div class="box c"><div class="box-t">Padrão-ouro</div>
<p><strong>Colonoscopia com ileoscopia + biópsias escalonadas.</strong> Achados: eritema difuso, perda do padrão vascular, friabilidade, granularidade, ulcerações superficiais, <strong>pseudopólipos</strong> — sempre <strong>contínuos e iniciando no reto</strong>.</p></div>

<h3>// Histologia</h3>
<ul>
<li><strong>Distorção de criptas</strong>, abscessos crípticos, plasmocitose basal</li>
<li>Depleção de células caliciformes (mucina)</li>
<li>Inflamação limitada à mucosa <span class="kid">(o estrago é só na "casquinha" de dentro, não atravessa a parede)</span></li>
</ul>

<h3>// Laboratório</h3>
<ul>
<li>Anemia, ↑PCR/VHS, ↑plaquetas, ↓albumina (gravidade)</li>
<li><strong>Calprotectina fecal</strong> — marcador de atividade inflamatória</li>
<li><strong>p-ANCA</strong> positivo em ~60–70%</li>
</ul>

<div class="box r"><div class="box-t">⚠️ Antes de tratar como surto — descartar infecção</div>
<p>Toda colite aguda grave exige <strong>coprocultura + toxina/PCR para <em>C. difficile</em></strong> e pesquisa de CMV (em refratários/imunossuprimidos). O <em>C. difficile</em> é causa frequente de "falso surto" e muda toda a conduta.</p></div>

<div class="trap"><b>🪤 Pega-ratão:</b> <strong>nunca peça colonoscopia completa ou faça preparo agressivo na colite aguda grave</strong> — risco de perfuração e megacólon. Use <strong>retossigmoidoscopia flexível sem preparo</strong> e <strong>radiografia / TC de abdome</strong> para avaliar dilatação.</div>
`},

{id:'gr', t:'⚕️ Gravidade', html:`
<h2>⚕️ Classificação de Gravidade</h2>
<div class="box o"><div class="box-t">Truelove & Witts — colite aguda GRAVE (ASUC)</div>
<p>Grave = <strong>≥ 6 evacuações com sangue/dia</strong> + ≥ 1 sinal sistêmico:</p>
<table>
<tr><th>Parâmetro</th><th>Grave</th></tr>
<tr><td>Evacuações sanguinolentas</td><td><strong>≥ 6/dia</strong></td></tr>
<tr><td>Temperatura</td><td>&gt; 37,8 °C</td></tr>
<tr><td>Frequência cardíaca</td><td>&gt; 90 bpm</td></tr>
<tr><td>Hemoglobina</td><td>&lt; 10,5 g/dL</td></tr>
<tr><td>VHS</td><td>&gt; 30 mm/h (e/ou PCR ↑)</td></tr>
</table>
<p class="kid">(Se a pessoa vai muito ao banheiro com sangue E o corpo "ferve" — febre, coração rápido, sangue baixo — é grave e interna.)</p></div>

<div class="box c"><div class="box-t">Critérios de Oxford (DIA 3)</div>
<p>Reavaliar resposta ao corticoide IV no <strong>3º dia</strong>. Prevê falha (≈85% de colectomia) se:</p>
<ul>
<li><strong>&gt; 8 evacuações/dia</strong>, OU</li>
<li><strong>3–8 evacuações/dia + PCR &gt; 45 mg/L</strong></li>
</ul>
<p>→ Acionar <strong>terapia de resgate</strong> ou cirurgia precocemente.</p></div>

<div class="mnem"><div class="mnem-w">ÍNDICE DE MAYO</div><div>Escore endoscópico/clínico de atividade (0–12): frequência de evacuações + sangramento retal + achado endoscópico + avaliação global. <strong>Mayo endoscópico 0–1 = cicatrização de mucosa</strong> (alvo terapêutico).</div></div>
`},

{id:'tc', t:'💊 Tto Clínico', html:`
<h2>💊 Tratamento Clínico (escada)</h2>
<table>
<tr><th>Cenário</th><th>1ª linha</th><th>Escalonamento</th></tr>
<tr><td>Proctite/leve-moderada</td><td><strong>5-ASA</strong> (mesalazina) tópico ± oral</td><td>Corticoide tópico (budesonida MMX)</td></tr>
<tr><td>Moderada-grave</td><td>Corticoide sistêmico p/ indução</td><td>Tiopurinas, anti-TNF, vedolizumabe, ustequinumabe, tofacitinibe, etrasimode</td></tr>
<tr><td>Manutenção</td><td>5-ASA / imunobiológico</td><td><strong>Corticoide NÃO é manutenção</strong></td></tr>
</table>

<div class="box r"><div class="box-t">🚨 Colite aguda grave (ASUC) — emergência</div>
<ul>
<li>Internação, hidratação, correção de distúrbios (K⁺, Mg²⁺), <strong>profilaxia de TEV</strong></li>
<li><strong>Corticoide IV</strong> (hidrocortisona 100 mg 6/6h ou metilprednisolona 60 mg/dia) — 1ª linha</li>
<li>Suspender antidiarreicos, opioides, anticolinérgicos (precipitam megacólon)</li>
<li><strong>Avaliação cirúrgica precoce desde a admissão</strong> (equipe multidisciplinar)</li>
<li><strong>Reavaliar no DIA 3</strong> (Oxford) → resposta inadequada = resgate</li>
</ul></div>

<div class="box p"><div class="box-t">Terapia de resgate (falha em 72h)</div>
<ul>
<li><strong>Infliximabe</strong> 5 mg/kg IV, OU</li>
<li><strong>Ciclosporina</strong> 2 mg/kg/dia IV</li>
<li>Eficácia comparável (estudo CYSIF/CONSTRUCT). Se <strong>sem resposta em ~7 dias → colectomia</strong>.</li>
</ul></div>

<div class="trap"><b>🪤 Pega-ratão:</b> resgate é <strong>monoterapia sequencial</strong>. <strong>Não</strong> empilhar ciclosporina <em>sobre</em> infliximabe (ou vice-versa) — o duplo resgate dispara morbimortalidade infecciosa. Falhou o 1º resgate → mesa cirúrgica.</div>
`},

{id:'ind', t:'✂️ Indicações Cx', html:`
<h2>✂️ Indicações Cirúrgicas</h2>
<p>A cirurgia <strong>cura</strong> a RCU (remove todo tecido em risco). Divide-se em emergência e eletiva.</p>

<div class="box r"><div class="box-t">Emergência / urgência</div>
<ul>
<li><strong>Colite fulminante</strong> refratária ao tratamento clínico</li>
<li><strong>Megacólon tóxico</strong> (cólon &gt; 6 cm + toxemia)</li>
<li><strong>Perfuração</strong> / peritonite</li>
<li><strong>Hemorragia maciça</strong> incontrolável</li>
<li>Falha de resgate na ASUC</li>
</ul>
<p>→ Operação de escolha: <strong>colectomia abdominal total (subtotal) + ileostomia terminal</strong>, deixando o coto retal (Hartmann). <span class="kid">(Tira o cólon doente agora, sem mexer no reto e sem fazer bolsa — paciente está grave demais.)</span></p></div>

<div class="box o"><div class="box-t">Eletiva</div>
<ul>
<li><strong>Refratariedade</strong> / dependência de corticoide / intolerância às drogas</li>
<li><strong>Displasia de alto grau</strong>, displasia visível não ressecável, ou <strong>carcinoma colorretal</strong></li>
<li>Retardo de crescimento (pediátrico)</li>
</ul>
<p>→ Operação de escolha: <strong>proctocolectomia restauradora com bolsa ileal e anastomose bolsa-anal (IPAA / bolsa em J)</strong>.</p></div>

<div class="box c"><div class="box-t">Vigilância de displasia</div>
<p>Colonoscopia de rastreio iniciando <strong>8 anos após o diagnóstico</strong> (na pancolite); <strong>imediata e anual se CEP associada</strong>. Preferir <strong>cromoendoscopia</strong> / luz branca de alta definição com biópsias dirigidas.</p></div>

<div class="trap"><b>🪤 Pega-ratão:</b> a colectomia <strong>total</strong> (e não segmentar) é a regra, pois <strong>todo o cólon está em risco oncológico</strong>. Ressecção segmentar fica reservada a idosos selecionados / alto risco cirúrgico.</div>
`},

<div class="cap">cólon ascendente/transverso = AMS (ciano) · descendente/sigmoide/reto = AMI (roxo)</div>

<table>
<tr><th>Eixo</th><th>Ramos</th><th>Território</th></tr>
<tr><td><strong>AMS</strong></td><td>Íleocólica, cólica direita (inconstante), cólica média</td><td>Ceco → transverso proximal</td></tr>
<tr><td><strong>AMI</strong></td><td>Cólica esquerda, sigmóideas, retal superior</td><td>Transverso distal → reto sup.</td></tr>
</table>

<div class="box c"><div class="box-t">Pontos cirúrgicos</div>
<ul>
<li><strong>Arcada marginal de Drummond</strong> e <strong>arco de Riolan</strong>: colaterais que conectam AMS–AMI (irrigam após ligaduras).</li>
<li><strong>Ponto de Sudeck / Griffiths</strong> (flexura esplênica) e <strong>ponto crítico de Sudeck</strong> (retossigmoide): áreas-vigia de isquemia.</li>
<li>Drenagem da bolsa ileal depende da preservação dos <strong>vasos da AMS no íleo terminal</strong> — não esqueletizar demais o mesentério para permitir descida ao ânus.</li>
<li><strong>Plexo hipogástrico</strong> e nervos pélvicos: dissecção retal no plano correto (mesorreto/TME) evita disfunção sexual/urinária.</li>
</ul></div>
`},

{id:'tx', t:'🔪 Técnica', html:`
<h2>🔪 Técnica Cirúrgica</h2>
<h3>// Posicionamento & preparo</h3>
<ul>
<li>Posição de <strong>Lloyd-Davies (litotomia modificada)</strong> — acesso abdominal e perineal simultâneo</li>
<li>Pernas em perneiras, leve Trendelenburg; sondagem vesical; possível cateter ureteral em reoperações</li>
<li>Acesso laparoscópico/robótico é hoje preferencial (menor íleo, menos aderências, melhor fertilidade)</li>
</ul>

<h3>// Estratégia em estágios (ASCRS 2021)</h3>
<table>
<tr><th>Estágio</th><th>Quando</th></tr>
<tr><td><strong>1 tempo</strong></td><td>Proctocolectomia + IPAA sem ileostomia — só em casos muito selecionados</td></tr>
<tr><td><strong>2 tempos</strong></td><td>Proctocolectomia + IPAA + ileostomia em alça → fechamento depois</td></tr>
<tr><td><strong>3 tempos</strong></td><td>(1) Colectomia total + ileostomia → (2) Proctectomia + IPAA + alça → (3) Fechar ileostomia. <strong>Preferido em ASUC / imunossuprimidos / desnutridos</strong></td></tr>
</table>

<h3>// Passo a passo — proctocolectomia restauradora com IPAA</h3>
<div class="step"><div class="step-n">1</div><div class="step-c"><b>Mobilização do cólon:</b> liberação medial-para-lateral, ligadura dos pedículos (íleocólica, cólica média, AMI). Preservar arcada marginal para a bolsa.</div></div>
<div class="step"><div class="step-n">2</div><div class="step-c"><b>Mobilização das flexuras</b> (hepática e esplênica) e descida do mesentério ileal — manobras de alongamento para a bolsa alcançar a pelve sem tensão.</div></div>
<div class="step"><div class="step-n">3</div><div class="step-c"><b>Proctectomia com dissecção total do mesorreto (TME)</b> em plano avascular, protegendo nervos pélvicos.</div></div>
<div class="step"><div class="step-n">4</div><div class="step-c"><b>Secção retal baixa</b> com grampeador linear cortante; transecção idealmente <strong>2 cm acima da linha pectínea</strong> (preserva zona de transição anal).</div></div>
<div class="step"><div class="step-n">5</div><div class="step-c"><b>Confecção da bolsa ileal em J</b> (~15–20 cm) com grampeador linear; enterotomia no ápice para o anvil.</div></div>
<div class="step"><div class="step-n">6</div><div class="step-c"><b>Anastomose bolsa-anal (IPAA):</b> <strong>duplo grampeamento (stapled)</strong> com grampeador circular OU <strong>mucosectomia + anastomose manual</strong> ao nível da linha pectínea.</div></div>
<div class="step"><div class="step-n">7</div><div class="step-c"><b>Teste de estanqueidade</b> (ar/azul de metileno), <strong>ileostomia em alça</strong> derivativa de proteção e drenagem pélvica.</div></div>

<div class="box p"><div class="box-t">Stapled × Mucosectomia</div>
<p><strong>Duplo grampeamento:</strong> mais rápido, melhor função/continência, mas deixa <strong>cuff de mucosa retal</strong> (risco de "cuffite" e displasia residual → exige vigilância).<br>
<strong>Mucosectomia + manual:</strong> remove toda a mucosa em risco (indicada em displasia/CA do reto distal), porém pior resultado funcional.</p></div>

<h3>// Instrumentação — mão a mão</h3>
<div class="hand">
<div class="hand-c l"><div class="hand-t">🤚 MÃO ESQUERDA</div>
<ul style="margin-left:1rem">
<li>Pinça atraumática / <strong>Babcock</strong> ou bowel grasper (tração e exposição do cólon)</li>
<li>Afastamento e contra-tração do mesentério</li>
<li>No laparo: grasper para criar tensão no plano de dissecção</li>
</ul></div>
<div class="hand-c r"><div class="hand-t">✋ MÃO DIREITA</div>
<ul style="margin-left:1rem">
<li><strong>Energia</strong> (LigaSure / bisturi ultrassônico / monopolar) para secção do mesentério</li>
<li><strong>Grampeadores</strong> lineares (cólon/bolsa) e circular (anastomose)</li>
<li>Porta-agulha para reforço/ângulos críticos</li>
</ul></div>
</div>

<h3>// Fios & grampeadores — o que e quando</h3>
<table>
<tr><th>Momento</th><th>Material</th></tr>
<tr><td>Selamento de pedículos vasculares</td><td>Energia avançada (LigaSure/ultrassônico) ou clipe/ligadura</td></tr>
<tr><td>Secção do reto distal</td><td>Grampeador <strong>linear cortante</strong> (carga roxa/azul)</td></tr>
<tr><td>Bolsa em J</td><td>Grampeador <strong>linear</strong> (GIA)</td></tr>
<tr><td>Anastomose bolsa-anal</td><td>Grampeador <strong>circular (EEA)</strong> — duplo grampeamento</td></tr>
<tr><td>Reforço de ângulos / mesentério</td><td><strong>Polipropileno 3-0/4-0</strong> ou <strong>poliglactina 3-0</strong></td></tr>
<tr><td>Maturação da ileostomia</td><td><strong>Poliglactina 3-0</strong> (sutura mucocutânea evertida)</td></tr>
<tr><td>Fechamento de aponeurose</td><td>PDS / polidioxanona 0–1 (sutura contínua)</td></tr>
</table>
`},

{id:'cp', t:'⚠️ Complicações', html:`
<h2>⚠️ Complicações</h2>
<table>
<tr><th>Complicação</th><th>Notas</th></tr>
<tr><td><strong>Pouchite (bolsite)</strong></td><td>Mais comum da IPAA (até ~50% em 10 anos). Diarreia, urgência, sangramento. 1ª linha: <strong>metronidazol/ciprofloxacino</strong>. Classifica-se pela resposta a ATB.</td></tr>
<tr><td><strong>Deiscência da anastomose / sepse pélvica</strong></td><td>Temida — compromete função da bolsa e pode levar à perda da bolsa. Ileostomia de proteção reduz a gravidade.</td></tr>
<tr><td><strong>Estenose da anastomose</strong></td><td>Dilatação digital/endoscópica</td></tr>
<tr><td><strong>Fístula bolsa-vaginal</strong></td><td>Sobretudo após mucosectomia/sepse</td></tr>
<tr><td><strong>Obstrução por brida / íleo</strong></td><td>Frequente nos primeiros meses</td></tr>
<tr><td><strong>Cuffite</strong></td><td>Inflamação do cuff retal residual (técnica grampeada) — mesalazina tópica</td></tr>
<tr><td><strong>Disfunção sexual/urinária</strong></td><td>Lesão de nervos pélvicos na proctectomia</td></tr>
<tr><td><strong>↓ Fertilidade feminina</strong></td><td>Aderências tubárias pélvicas — discutir antes; abordagem minimamente invasiva reduz risco</td></tr>
<tr><td><strong>Falência da bolsa</strong></td><td>~5–15% a longo prazo → ileostomia definitiva</td></tr>
</table>

<div class="box r"><div class="box-t">🩸 TEV — não esquecer</div>
<p>DII é estado <strong>pró-trombótico</strong>. Profilaxia de TEV peri e pós-operatória é mandatória. ASCRS 2021: considerar <strong>profilaxia estendida</strong> em pacientes expostos a <strong>tofacitinibe</strong>.</p></div>

<div class="box g"><div class="box-t">Adjuvante oncológico</div>
<p>Se a peça revelar adenocarcinoma colorretal, segue estadiamento e indicação de QT conforme TNM (estádio III → quimioterapia adjuvante). A presença de CA pode contraindicar/alterar o tempo da IPAA.</p></div>
`},

{id:'pr', t:'🎯 Pega-Ratões', html:`
<h2>🎯 Pega-Ratões & Mnemônicos</h2>
<div class="mnem"><div class="mnem-w">CONTÍNUA</div><div>RCU é <strong>CONTÍNUA</strong> e começa no <strong>reto</strong> — se a prova descrever lesões <em>salteadas</em> ou poupar o reto, pense <strong>Crohn</strong>.</div></div>
<div class="mnem"><div class="mnem-w">6 + 1</div><div>Truelove-Witts grave = <strong>≥6 evacuações sanguinolentas</strong> + ≥1 sinal sistêmico (febre, taqui, Hb↓, VHS↑).</div></div>
<div class="mnem"><div class="mnem-w">DIA 3</div><div>Reavaliar ASUC no <strong>3º dia</strong> de corticoide IV (Oxford): &gt;8 fezes/dia OU 3–8 + PCR&gt;45 → resgate/cirurgia.</div></div>
<div class="mnem"><div class="mnem-w">CURA = TUDO FORA</div><div>A cirurgia cura a RCU porque remove <strong>todo</strong> o cólon/reto em risco. Em Crohn, NÃO cura.</div></div>
<div class="mnem"><div class="mnem-w">CEP → CA</div><div>RCU + <strong>colangite esclerosante primária</strong> = vigilância de displasia <strong>anual e imediata</strong> (risco ↑↑ de CCR e colangiocarcinoma).</div></div>

<div class="trap"><b>🪤</b> <strong>Tabagismo é protetor</strong> na RCU (inverso do Crohn). Não é recomendação clínica — é dado de prova.</div>
<div class="trap"><b>🪤</b> Megacólon tóxico: <strong>não</strong> faça colonoscopia/preparo; rx/TC + descompressão. Cólon &gt; 6 cm + toxemia.</div>
<div class="trap"><b>🪤</b> Na emergência a operação é <strong>colectomia total + ileostomia terminal (Hartmann)</strong> — <strong>nunca</strong> IPAA no paciente instável/desnutrido/imunossuprimido.</div>
<div class="trap"><b>🪤</b> Técnica grampeada deixa <strong>cuff retal</strong> → mantém vigilância endoscópica do cuff (risco de displasia residual).</div>
<div class="trap"><b>🪤</b> Sempre excluir <strong>C. difficile</strong> e <strong>CMV</strong> antes de rotular como "surto refratário".</div>
`},

{id:'qz', t:'📝 Questões RS', html:`
<h2>📝 Questões — Bancas RS</h2>
<p class="cap" style="text-align:left">Questões originais, no estilo das bancas. Não reproduzem enunciados proprietários.</p>

<div class="q"><div class="q-b">// HCPA · estilo</div>
<div class="q-stem">Mulher, 28 anos, RCU pancolônica, internada com 9 evacuações sanguinolentas/dia, FC 104, T 38,1 °C, Hb 9,8. Iniciado hidrocortisona IV. No 3º dia mantém 10 evacuações/dia e PCR 88 mg/L. Conduta mais apropriada:</div>
<div class="q-alt">A) Manter corticoide por mais 7 dias</div>
<div class="q-alt">B) Iniciar mesalazina oral em dose plena</div>
<div class="q-alt">C) Terapia de resgate com infliximabe ou ciclosporina, com avaliação cirúrgica</div>
<div class="q-alt">D) Colonoscopia completa para reestadiar</div>
<details><summary>▸ resposta</summary><div class="ans"><b>C.</b> Critério de Oxford no dia 3 indica falha do corticoide (&gt;8 evac. e PCR&gt;45) → resgate sequencial + cirurgião na equipe. Colonoscopia completa é contraindicada na fase aguda grave.</div></details></div>

<div class="q"><div class="q-b">// AMRIGS · estilo</div>
<div class="q-stem">Achado que favorece RCU em vez de doença de Crohn:</div>
<div class="q-alt">A) Acometimento transmural com granulomas</div>
<div class="q-alt">B) Lesões salteadas com poupança retal</div>
<div class="q-alt">C) Inflamação contínua, restrita à mucosa, iniciando no reto</div>
<div class="q-alt">D) Fístulas perianais</div>
<details><summary>▸ resposta</summary><div class="ans"><b>C.</b> RCU = mucosa/submucosa, contínua, ascendente a partir do reto. Transmural, granuloma, skip lesions e fístulas são de Crohn.</div></details></div>

<div class="q"><div class="q-b">// Santa Casa POA · estilo</div>
<div class="q-stem">Paciente com RCU e megacólon tóxico refratário. Operação de escolha:</div>
<div class="q-alt">A) Proctocolectomia restauradora com IPAA em tempo único</div>
<div class="q-alt">B) Colectomia abdominal total com ileostomia terminal</div>
<div class="q-alt">C) Colectomia segmentar do segmento mais dilatado</div>
<div class="q-alt">D) Colostomia descompressiva</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> Na emergência, colectomia total + ileostomia terminal (coto retal a Hartmann). IPAA é diferida para paciente estável — primeiro estágio do "3-tempos".</div></details></div>

<div class="q"><div class="q-b">// PUC-RS · estilo</div>
<div class="q-stem">Sobre a anastomose bolsa-anal (IPAA), é correto afirmar:</div>
<div class="q-alt">A) A técnica grampeada remove toda a mucosa retal</div>
<div class="q-alt">B) A complicação tardia mais comum é a pouchite</div>
<div class="q-alt">C) Dispensa ileostomia de proteção na maioria dos casos</div>
<div class="q-alt">D) A bolsa em S é a configuração padrão atual</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> Pouchite é a complicação tardia mais frequente da IPAA. A técnica grampeada deixa cuff de mucosa; a derivação com ileostomia em alça é a regra; a bolsa em J é a configuração padrão.</div></details></div>

<div class="q"><div class="q-b">// GHC · estilo</div>
<div class="q-stem">Sobre vigilância de neoplasia na RCU, assinale a correta:</div>
<div class="q-alt">A) Inicia-se imediatamente ao diagnóstico em todos os pacientes</div>
<div class="q-alt">B) Inicia ~8 anos após o diagnóstico na pancolite; imediata e anual se houver CEP</div>
<div class="q-alt">C) Não é necessária após início de biológico</div>
<div class="q-alt">D) Ressecção segmentar é suficiente ao detectar displasia de alto grau</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> Rastreio com cromoendoscopia inicia ~8 anos após o dx (pancolite); CEP associada → vigilância imediata e anual. Displasia de alto grau/CA indica proctocolectomia total, não segmentar.</div></details></div>

<div class="q"><div class="q-b">// HCPA · estilo</div>
<div class="q-stem">Manifestação extra-intestinal da RCU cujo curso é independente da atividade da doença intestinal:</div>
<div class="q-alt">A) Eritema nodoso</div>
<div class="q-alt">B) Artrite periférica</div>
<div class="q-alt">C) Colangite esclerosante primária</div>
<div class="q-alt">D) Episclerite</div>
<details><summary>▸ resposta</summary><div class="ans"><b>C.</b> CEP, espondilite anquilosante, uveíte e pioderma gangrenoso correm independentes da atividade; eritema nodoso, artrite periférica e episclerite acompanham os surtos.</div></details></div>

<div class="q"><div class="q-b">// AMRIGS · estilo</div>
<div class="q-stem">Na colite aguda grave, antes de classificar como refratária, é obrigatório:</div>
<div class="q-alt">A) Tomografia de crânio</div>
<div class="q-alt">B) Pesquisa de toxina/PCR de C. difficile (e CMV em imunossuprimidos)</div>
<div class="q-alt">C) Colonoscopia total com preparo</div>
<div class="q-alt">D) Iniciar antidiarreico</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> Infecção sobreposta (C. difficile/CMV) simula falha terapêutica. Antidiarreicos e colonoscopia com preparo são contraindicados na fase aguda grave.</div></details></div>

<div class="q"><div class="q-b">// Santa Casa POA · estilo</div>
<div class="q-stem">Vantagem da abordagem em 3 estágios na RCU grave/imunossuprimida:</div>
<div class="q-alt">A) Evita totalmente a ileostomia</div>
<div class="q-alt">B) Permite retirar o cólon doente e suspender imunossupressão antes da bolsa, reduzindo sepse pélvica</div>
<div class="q-alt">C) Dispensa a proctectomia</div>
<div class="q-alt">D) Garante anastomose em tempo único</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> O 1º tempo (colectomia + ileostomia) controla a doença e a nutrição e permite desmame de corticoide/biológico antes de confeccionar a bolsa, reduzindo complicações.</div></details></div>

<div class="q"><div class="q-b">// PUC-RS · estilo</div>
<div class="q-stem">Sobre a secção retal na proctocolectomia, o nível ideal de transecção em relação à linha pectínea é:</div>
<div class="q-alt">A) Exatamente sobre a linha pectínea</div>
<div class="q-alt">B) Cerca de 2 cm acima da linha pectínea</div>
<div class="q-alt">C) 8 cm acima</div>
<div class="q-alt">D) Abaixo da linha pectínea</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> Transecção ~2 cm acima da pectínea preserva a zona de transição anal e melhora a continência na técnica grampeada.</div></details></div>

<div class="q"><div class="q-b">// GHC · estilo</div>
<div class="q-stem">Fator de risco trombótico em DII com implicação peri-operatória:</div>
<div class="q-alt">A) Recomenda-se evitar profilaxia de TEV pelo risco de sangramento</div>
<div class="q-alt">B) DII é estado pró-trombótico; profilaxia de TEV é indicada, podendo ser estendida (ex.: uso de tofacitinibe)</div>
<div class="q-alt">C) Profilaxia só é necessária se houver trombose prévia</div>
<div class="q-alt">D) Anticoagulação plena é padrão em todos</div>
<details><summary>▸ resposta</summary><div class="ans"><b>B.</b> A inflamação da DII confere hipercoagulabilidade; profilaxia de TEV é mandatória e a ASCRS 2021 sugere profilaxia estendida em pacientes expostos a tofacitinibe.</div></details></div>
`}
];

const tabsEl=document.getElementById('tabs'), wrapEl=document.getElementById('wrap');
SECS.forEach((s,i)=>{
  const t=document.createElement('div');t.className='tab'+(i===0?' on':'');t.textContent=s.t;t.onclick=()=>go(i);tabsEl.appendChild(t);
  const d=document.createElement('div');d.className='sec'+(i===0?' on':'');d.id='sec-'+s.id;d.innerHTML=s.html;wrapEl.appendChild(d);
});
function go(i){
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));
  document.querySelectorAll('.sec').forEach((d,k)=>d.classList.toggle('on',k===i));
  document.querySelectorAll('.tab')[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{
  const on=[...document.querySelectorAll('.tab')].findIndex(t=>t.classList.contains('on'));
  if(e.key==='ArrowRight'&&on<SECS.length-1)go(on+1);
  if(e.key==='ArrowLeft'&&on>0)go(on-1);
});
</script>
</body>
</html>
